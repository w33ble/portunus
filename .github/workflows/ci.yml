name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs CI as a gate before building artifacts.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Integration tests (real sshd, RustFS in Docker) fail instead of skipping when deps are missing.
  PORTUNUS_REQUIRE_INTEGRATION: "1"

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: OpenSSH server for integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
      - run: mise run check

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: OpenSSH server for integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
      - run: mise run test:race

  gohawk:
    name: gohawk static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run lint:gohawk

  # The shipped cgo build; check/test only compile the purego backend.
  # Linux only: macOS builds are verified locally (macOS runner minutes are scarce on the free tier).
  build:
    name: Native build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: GTK4 and WebKitGTK headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: mise run build

name: Release

# Pushing a v* tag (e.g. v0.2.0) builds macOS and Linux artifacts and opens a draft GitHub
# Release to review and publish. Run it manually with a version for a dry run: everything is
# built and uploaded as workflow artifacts, but no release is created.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the "v" (dry run, nothing is published)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then v="${REF_NAME#v}"; else v="$INPUT"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$v' is not a release version (expected e.g. 1.2.0 or 1.2.0-rc.1)"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  macos:
    name: macOS (universal)
    needs: [version, ci, e2e]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PORTUNUS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Builds arm64 and amd64, joins them with lipo, and ad-hoc signs the bundle.
      - run: wails3 task darwin:package:universal
      - run: wails3 task darwin:create:dmg
      - name: Verify and collect
        run: |
          app=bin/Portunus.app
          ls bin | grep -qx 'Portunus.app' # exact case; the runner's filesystem is case-insensitive
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$PORTUNUS_VERSION"
          lipo "$app/Contents/MacOS/portunus" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/portunus" --version | grep -q "^portunus $PORTUNUS_VERSION "
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/Portunus-$PORTUNUS_VERSION-macos-universal.zip"
          mv bin/*.dmg "dist/Portunus-$PORTUNUS_VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.runner }})
    needs: [version, ci, e2e]
    strategy:
      fail-fast: false
      matrix:
        # Hosted arm64 Linux runners are free only for public repositories.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PORTUNUS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: GTK4 and WebKitGTK headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: wails3 task linux:build
      - run: wails3 task common:generate:notices
      - run: wails3 task linux:generate:dotdesktop
      - run: wails3 task linux:generate:deb
      - run: wails3 task linux:generate:rpm
      - name: Collect
        run: |
          arch=$(go env GOARCH)
          name="portunus-$PORTUNUS_VERSION-linux-$arch"
          ./bin/portunus --version | grep -q "^portunus $PORTUNUS_VERSION " || { echo "::error::binary not stamped with $PORTUNUS_VERSION"; exit 1; }
          mkdir -p dist "$name"
          cp bin/portunus LICENSE THIRD_PARTY_NOTICES.md build/linux/portunus.desktop build/linux/portunus-512.png "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          rpmarch=$([ "$arch" = arm64 ] && echo aarch64 || echo x86_64)
          mv bin/portunus.deb "dist/portunus_${PORTUNUS_VERSION}_${arch}.deb"
          mv bin/portunus.rpm "dist/portunus-${PORTUNUS_VERSION}-1.${rpmarch}.rpm"
          if [ "$arch" = amd64 ]; then cp THIRD_PARTY_NOTICES.md dist/; fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: [version, macos, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * >SHA256SUMS && cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Portunus $VERSION" --generate-notes $prerelease --notes "$(cat <<'EOF'
          ## Install

          - **macOS** (Apple silicon and Intel): open the `.dmg` and drag Portunus to Applications. The app isn't signed or notarized, so macOS quarantines it and **Open Anyway** in Privacy & Security isn't enough. Clear the quarantine flag once in Terminal, then open it as usual: `xattr -dr com.apple.quarantine /Applications/Portunus.app`
          - **Debian/Ubuntu**: `sudo apt install ./portunus_*.deb`. **Fedora/RHEL**: `sudo dnf install ./portunus-*.rpm`. Needs GTK 4 and WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+, Fedora 40+).
          - **Other Linux**: the `.tar.gz` contains the binary.

          Verify downloads against `SHA256SUMS`. Third-party licenses are in `THIRD_PARTY_NOTICES.md`.
          EOF
          )"

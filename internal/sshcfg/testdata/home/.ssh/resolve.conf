Host web
  HostName h.example.com
  User bob
  Port 2200
  IdentityFile ~/.ssh/id_here
  IdentityFile ~/.ssh/id_pubonly
  IdentityFile ~/.ssh/id_missing
  IdentityFile %d/.ssh/key_%h_%r_%p
  CertificateFile ~/.ssh/id_here-cert.pub
  IdentityAgent ~/agents/%h.sock
  HostKeyAlias al-%h-%n
  UserKnownHostsFile ~/.ssh/kh1 "~/.ssh/kh 2"
  ProxyJump jump@bastion:2222
  ConnectTimeout 7
  ServerAliveInterval 15
  ServerAliveCountMax 4
  StrictHostKeyChecking accept-new
  HashKnownHosts yes
  IdentitiesOnly yes
Host agentenv
  IdentityAgent SSH_AUTH_SOCK
Host agentnone
  IdentityAgent none
Host pc
  ProxyCommand nc %h %p
Host tok
  HostName t.example.com
  User tu
  Port 2022
  IdentityFile ~/.ssh/tok_%n_%l_%L_%i_%u_%C_%%_%h_%p_%r
  ControlPath /ctl/%n_%l_%L_%i_%u_%C_%%_%h_%p_%r
Host mexec
  HostName m.example.com
Match exec "false"
  User never

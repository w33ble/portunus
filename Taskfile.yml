version: '3'

vars:
  APP_NAME: "portunus"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

  # Version stamping. Release builds set PORTUNUS_VERSION (e.g. 1.2.0, no "v"); every other build
  # is a dev build named for its commit, with -dirty when the tree has uncommitted changes.
  COMMIT:
    sh: git rev-parse --short=7 HEAD 2>/dev/null || echo unknown
  DIRTY:
    sh: git diff --quiet HEAD -- 2>/dev/null && echo "" || echo "-dirty"
  VERSION: '{{if .PORTUNUS_VERSION}}{{.PORTUNUS_VERSION}}{{else}}dev-{{.COMMIT}}{{.DIRTY}}{{end}}'
  # deb/rpm need a version that sorts: real releases as-is, dev builds as 0.0.0-dev+<commit>.
  PACKAGE_VERSION: '{{if .PORTUNUS_VERSION}}{{.PORTUNUS_VERSION}}{{else}}0.0.0-dev+{{.COMMIT}}{{end}}'
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  VERSION_LDFLAGS: >-
    -X github.com/w33ble/portunus/internal/version.version={{.VERSION}}
    -X github.com/w33ble/portunus/internal/version.commit={{.COMMIT}}
    -X github.com/w33ble/portunus/internal/version.date={{.BUILD_DATE}}

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
